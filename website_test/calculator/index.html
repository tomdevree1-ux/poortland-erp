<style>
  :root{
    --forest-950:#0F160F; --forest-900:#141C15; --forest-800:#222E24;
    --canvas:#FAF6EE; --surface:#FFFDF8; --raised:#F1E9D8; --sunken:#ECE3D2;
    --ink:#141C15; --ink-body:#222E24; --ink-muted:#6E6450; --ink-faint:#9C8E72;
    --bronze-600:#8A6A3C; --bronze-500:#A6824C; --bronze-400:#C2A36B; --bronze-300:#D9C194; --corten-600:#8E4A2E;
    --accent:#A6824C; --accent-strong:#8A6A3C;
    --display:'Cormorant',Georgia,'Times New Roman',serif; --serif:'Cormorant',Georgia,serif;
    --sans:'Hanken Grotesk',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    --line:rgba(20,28,21,0.07); --line-strong:rgba(20,28,21,0.15);
  }
  body{background:var(--canvas);font-family:var(--sans);color:var(--ink-body);}
  h1,h2,.display,.serif{font-family:var(--display);}
  .cijfers{font-variant-numeric:tabular-nums;}
  /* ---- ERP topbar ---- */
  header.erpbar{position:sticky;top:0;z-index:40;background:rgba(250,246,238,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .logomark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1.4px solid rgba(20,28,21,0.6);font-family:var(--display);font-size:19px;color:var(--ink);flex:none;}
  .wordmark{font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:0.3em;font-size:13px;color:var(--ink);line-height:1;}
  .wordmark-sub{font-family:var(--sans);text-transform:uppercase;letter-spacing:0.2em;font-size:10px;color:var(--ink-muted);}
  .eyebrow{font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:0.26em;font-size:10.5px;color:var(--bronze-600);}
  .navlink{font-family:var(--sans);font-size:14px;color:var(--ink-muted);padding:6px 4px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;}
  .navlink:hover{color:var(--ink);}
  .navlink.on{color:var(--ink);border-bottom-color:var(--bronze-500);font-weight:600;}
  /* ---- surfaces (ERP: dun kader, klein hoekje, subtiele schaduw) ---- */
  .brand-txt{color:var(--ink);}
  .accent-txt{color:var(--bronze-600);}
  button.brand{background:var(--bronze-500);border-radius:5px;color:#FAF6EE;font-weight:600;}
  button.brand:hover{background:var(--bronze-400);}
  button.brand:active{background:var(--bronze-600);}
  .bg-white{background-color:var(--surface)!important;}
  .rounded-xl{border-radius:6px;}
  section.bg-white,div.bg-white{box-shadow:0 1px 2px rgba(15,22,15,0.05);}
  .border-gray-200,.border-gray-100{border-color:var(--line)!important;}
  .border-gray-50{border-color:rgba(20,28,21,0.05)!important;}
  .text-gray-500,.text-gray-600{color:var(--ink-muted)!important;}
  .text-gray-800{color:var(--ink-body)!important;}
  .text-gray-400{color:var(--ink-faint)!important;}
  /* ---- bloktitel: sans, genummerd, met onderlijn (zoals ERP-paneel) ---- */
  .bloktitel{display:flex;align-items:baseline;gap:8px;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:10px;}
  .bloktitel .badge{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--bronze-600);letter-spacing:0.08em;flex:none;}
  input,select{outline:none;}
  .cel{border:1px solid var(--line-strong);border-radius:5px;padding:7px 11px;width:100%;background:var(--surface);font-family:var(--sans);font-size:15px;color:var(--ink);}
  .cel:focus{border-color:var(--bronze-500);box-shadow:0 0 0 4px rgba(166,130,76,0.18);}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--sunken);border-radius:8px;}
  /* ================= Offerte-layout (ontwerp Poortland) ================= */
  .oblad{width:210mm;max-width:100%;margin:0 auto;background:var(--papier,#FAF6EE);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 40px rgba(15,22,15,0.13);box-sizing:border-box;padding:14mm 16mm 12mm;position:relative;font-family:var(--sans);color:var(--ink-body);}
  .oblad .oeyebrow{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze-600);}
  .oblad .olabel{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);}
  .okop{display:flex;justify-content:space-between;align-items:flex-start;}
  .omono{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1.4px solid var(--ink);position:relative;box-sizing:border-box;flex:none;margin-right:14px;}
  .omono::before{content:"";position:absolute;top:3px;left:3px;right:3px;bottom:3px;border:1px solid var(--ink);opacity:.3;}
  .omono b{font-family:var(--display);font-weight:600;font-size:24px;color:var(--ink);line-height:1;}
  .owoordmerk{font-family:var(--sans);font-size:17px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);line-height:1;}
  .osub{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-muted);}
  .obedrijf{text-align:right;font-size:11px;color:var(--ink-muted);line-height:1.75;}
  .ohairline{height:1px;background:rgba(166,130,76,.45);margin:8mm 0 6mm;}
  .oh1{font-family:var(--display);font-weight:500;font-size:34px;line-height:.95;letter-spacing:-.01em;color:var(--ink);margin:0;}
  .ometaband{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4mm 6mm;margin:5mm 0 6mm;}
  .owaarde{font-size:13px;font-weight:600;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums;}
  .opartijen{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-bottom:6mm;}
  .opartij{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5mm 6mm;}
  .opartij .onaam{font-weight:600;color:var(--ink);margin-top:3.5mm;}
  .oblad table{width:100%;border-collapse:collapse;}
  .oblad th{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 3mm 2.5mm 0;border-bottom:1.2px solid var(--ink);}
  .oblad th.r,.oblad td.r{text-align:right;}
  .oblad td{padding:2.6mm 3mm;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px;color:var(--ink-body);}
  .oblad tr.osectie td{padding-top:4mm;border-bottom:0;}
  .oonder{display:grid;grid-template-columns:1fr 72mm;gap:10mm;margin-top:6mm;}
  .ototalen{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5mm 6mm;height:fit-content;}
  .ototalen .orij{display:flex;justify-content:space-between;gap:8mm;padding:1.9mm 0;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
  .ototalen .oeind{border-top:1.2px solid var(--ink);margin-top:2mm;padding-top:3mm;display:flex;justify-content:space-between;align-items:center;}
  .ototalen .oeind .olabel{color:var(--ink);}
  .ototalen .obedrag{font-family:var(--display);font-weight:600;font-size:22px;color:var(--bronze-600);font-variant-numeric:tabular-nums;}
  .ovoorschot{margin-top:3mm;padding-top:2.5mm;border-top:1px dashed var(--line-strong);display:flex;justify-content:space-between;font-size:11px;color:var(--ink-muted);}
  .ovoorwaarden .oregels{display:grid;gap:6px;margin-top:4mm;font-size:12px;color:var(--ink-muted);line-height:1.5;}
  .ogoedkeuring{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:7mm;}
  .otekenvak{border:1px solid var(--line-strong);border-radius:6px;padding:5mm 6mm;min-height:22mm;position:relative;background:var(--surface);}
  .otekenvak .odatumlijn{position:absolute;left:6mm;right:6mm;bottom:5mm;border-top:1px solid var(--line-strong);padding-top:2mm;font-size:9px;color:var(--ink-faint);display:flex;justify-content:space-between;}
  .ovoet{margin-top:7mm;padding-top:4mm;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:9px;color:var(--ink-faint);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef } = React;
const D = window.PL_DATA;

const euro = (n) => (isNaN(n)?0:n).toLocaleString('nl-BE',{style:'currency',currency:'EUR'});
const num = (v) => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };
const uid = () => Math.random().toString(36).slice(2,9);

// ---------- standaardinstellingen (alles aanpasbaar in de tool) ----------
const STANDAARD = {
  families: {
    open:      { label:'Open / spijlen',      basis: 700,  perM2: 380 },
    halfopen:  { label:'Halfopen',            basis: 950,  perM2: 560 },
    dicht:     { label:'Dicht / plaat / hout', basis: 1240, perM2: 760 },
    standaard: { label:'Standaard',           basis: 900,  perM2: 500 },
  },
  uitvoering: {
    enkel:              { label:'Enkele draaipoort', factor: 1.0 },
    dubbel:             { label:'Dubbele draaipoort', factor: 1.9 },
    schuif_rail:        { label:'Schuifpoort op rail', factor: 1.2 },
    schuif_vrijdragend: { label:'Schuifpoort vrijdragend', factor: 1.4 },
    vast_hekwerk:       { label:'Vast hekwerk', factor: 0.8 },
  },
  // Prijslijst 2020: de echte tabellen per model, uitvoering en breedteklasse
  // (EUR per lopende meter). Indexatie staat op 0 tot Jef een percentage
  // opgeeft; de flow wordt voorlopig getest zonder finale prijsberekening.
  indexatie2020: 0,
  // Jef 2026-08-11: tarieven worden per kwartier verrekend en enkel gebruikt
  // voor transport en interventies. Technieker 24,50 en monteur 20,00 per 15 min.
  kwartier: { technieker: 24.5, monteur: 20 },
  // Jef 2026-08-11: bij Faac is de catalogusprijs de verkoopprijs en is de
  // inkoop een korting op die catalogusprijs: 50% standaard, 53% bij grotere
  // bestellingen. De marge volgt daar vanzelf uit.
  faacKorting: { standaard: 50, grootbestelling: 53 },
  marges: { poort: 30, paal: 30, toebehoren: 30, plaatsing: 30, transport: 0 },
  plaatsing: { poort: 450, automatisering: 650, ondergronds: 250 },
  // Jef 2026-08-12: de echte regiotabel uit de prijslijst (vervoerskosten per
  // regio, per voertuig en aantal personen). Boven 150 km rekent de formule
  // met de parameters die in het bestand geel staan.
  transport: {
    regios: [
      { van: 0,   tot: 5,   b1: 0,   b2: 0,   v1: 0,   v2: 0,   v3: 0 },
      { van: 5,   tot: 15,  b1: 41,  b2: 71,  v1: 47,  v2: 79,  v3: 111 },
      { van: 15,  tot: 20,  b1: 71,  b2: 121, v1: 88,  v2: 145, v3: 203 },
      { van: 20,  tot: 40,  b1: 104, b2: 168, v1: 136, v2: 211, v3: 286 },
      { van: 40,  tot: 60,  b1: 147, b2: 233, v1: 194, v2: 298, v3: 402 },
      { van: 60,  tot: 80,  b1: 186, b2: 292, v1: 249, v2: 378, v3: 507 },
      { van: 80,  tot: 100, b1: 216, b2: 332, v1: 292, v2: 434, v3: 576 },
      { van: 100, tot: 150, b1: 284, b2: 417, v1: 390, v2: 554, v3: 718 }
    ],
    parameters: { snelheidBestelwagen: 45, snelheidVrachtwagen: 35, kmBestelwagen: 1, kmVrachtwagen: 1.5, startkost: 25 }
  },
  btwOpties: [ {v:21,label:'21% (standaard)'}, {v:6,label:'6% (renovatie > 10 jaar)'}, {v:0,label:'Verlegd / medecontractant (0%)'} ],
  kortingMax: 20,
};

function App(){
  const [tab,setTab] = useState('calc');
  const [S,setS] = useState(STANDAARD);
  const [regels,setRegels] = useState([]);
  const [klant,setKlant] = useState({naam:'',adres:'',offertenr:'OFF-'+new Date().getFullYear()+'-001',datum:new Date().toISOString().slice(0,10),geldig:'30 dagen'});
  const [btw,setBtw] = useState(21);
  const [korting,setKorting] = useState(0);

  const add = (r) => setRegels(rs=>[...rs,{id:uid(),...r}]);
  const del = (id) => setRegels(rs=>rs.filter(r=>r.id!==id));
  const upd = (id,patch) => setRegels(rs=>rs.map(r=>r.id===id?{...r,...patch}:r));

  const T = useMemo(()=>berekenTotalen(regels,korting,btw),[regels,korting,btw]);

  return (
    <div className="min-h-screen">
      <header className="erpbar">
        <div className="max-w-6xl mx-auto px-8 h-14 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <span className="logomark">P</span>
            <div>
              <div className="wordmark">Poortland</div>
              <div className="wordmark-sub">Operations</div>
            </div>
          </div>
          <nav className="flex gap-6 items-center">
            {[['calc','Calculator'],['offerte','Klantofferte'],['instel','Instellingen']].map(([k,l])=>(
              <button key={k} onClick={()=>setTab(k)} className={"navlink "+(tab===k?'on':'')}>{l}</button>
            ))}
          </nav>
        </div>
      </header>
      <main className="max-w-6xl mx-auto px-8 py-7">
        <div className="mb-6 flex items-end justify-between gap-4">
          <div>
            <div className="eyebrow">Operations · offerte</div>
            <h1 className="mt-1 leading-none tracking-tight" style={{fontSize:'32px',fontWeight:500,color:'var(--ink)'}}>{({calc:'Offertecalculator',offerte:'Klantofferte',instel:'Instellingen'})[tab]}</h1>
          </div>
          <span className="eyebrow" style={{color:'var(--ink-faint)'}}>Prototype</span>
        </div>
        {tab==='calc'   && <Calc S={S} regels={regels} add={add} del={del} upd={upd} T={T} btw={btw} setBtw={setBtw} korting={korting} setKorting={setKorting} klant={klant} setKlant={setKlant}/>}
        {tab==='offerte'&& <Offerte regels={regels} T={T} btw={btw} korting={korting} klant={klant}/>}
        {tab==='instel' && <Instellingen S={S} setS={setS}/>}
      </main>
      <footer className="max-w-6xl mx-auto px-5 py-6 text-xs text-gray-400">
        Prototype. Prijsparameters zijn voorlopige schattingen en volledig aanpasbaar onder Instellingen. Vul Jefs definitieve cijfers daar in.
      </footer>
    </div>
  );
}

// ---------- rekenkern ----------
function regelVerkoop(r){ return r.kost*(1+ (r.marge||0)/100 )*(r.aantal||1); }
function regelKost(r){ return r.kost*(r.aantal||1); }
const MATERIAAL = ['poort','automatisering','paal','toebehoren'];

function berekenTotalen(regels,korting,btw){
  let mat=0,matKost=0,plaats=0,trans=0,kostTot=0;
  regels.forEach(r=>{
    const v=regelVerkoop(r), k=regelKost(r); kostTot+=k;
    if(MATERIAAL.includes(r.cat)){mat+=v;matKost+=k;}
    else if(r.cat==='plaatsing') plaats+=v;
    else if(r.cat==='transport') trans+=v;
  });
  const kortBedrag = mat*(korting/100);
  const subtotaal = mat - kortBedrag + plaats + trans;
  const btwBedrag = subtotaal*(btw/100);
  const totaal = subtotaal + btwBedrag;
  const margeE = (mat+plaats+trans) - kostTot - kortBedrag;
  const margePct = (mat+plaats+trans)>0 ? margeE/((mat+plaats+trans))*100 : 0;
  return {mat,matKost,plaats,trans,kortBedrag,subtotaal,btwBedrag,totaal,kostTot,margeE,margePct};
}

// ---------- Calculator-tab ----------
function Calc({S,regels,add,del,upd,T,btw,setBtw,korting,setKorting,klant,setKlant}){
  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 space-y-5">
        <PoortBlok S={S} add={add}/>
        <AutoBlok S={S} add={add}/>
        <PalenToebehorenBlok S={S} add={add}/>
        <PlaatsingBlok S={S} add={add}/>
        <TransportBlok S={S} add={add}/>
      </div>
      <div className="space-y-4">
        <KlantKaart klant={klant} setKlant={setKlant}/>
        <RegelLijst regels={regels} del={del} upd={upd}/>
        <TotaalKaart T={T} btw={btw} setBtw={setBtw} korting={korting} setKorting={setKorting} S={S}/>
      </div>
    </div>
  );
}

function Blok({titel,children}){
  const m = /^(\d+)\.\s*(.*)$/.exec(titel||'');
  return (
    <section className="bg-white rounded-xl border border-gray-200 p-5">
      <div className="bloktitel mb-4">{m && <span className="badge">{m[1]}</span>}<span>{m?m[2]:titel}</span></div>
      {children}
    </section>
  );
}
const Veld = ({label,children}) => (
  <label className="block"><span className="block text-[11px] font-bold uppercase tracking-[0.14em] text-gray-600">{label}</span>{children}</label>
);

function PoortBlok({S,add}){
  const [modelN,setModelN] = useState(D.models[0].n);
  const model = D.models.find(m=>m.n===modelN) || D.models[0];
  const uitvKeys = Object.keys(S.uitvoering);
  const beschikbaar = (k)=>({enkel:model.e,dubbel:model.d,schuif_rail:model.sr,schuif_vrijdragend:model.sv,vast_hekwerk:model.vh})[k];
  const eersteBeschik = uitvKeys.find(beschikbaar) || 'enkel';
  const [uitv,setUitv] = useState(eersteBeschik);
  const [b,setB] = useState(3000);
  const [h,setH] = useState(1600);
  const [vul,setVul] = useState(model.f);
  const [ral,setRal] = useState('7016');
  const [extra,setExtra] = useState(0);
  // Jef: bij een vrijdragende schuifpoort kan de achterbouw een kader of een
  // stijl zijn; de prijslijst heeft daarvoor twee sets. Aanname: de duurdere
  // set A is het kader en de goedkopere set B de stijl (te bevestigen).
  const [achterbouw,setAchterbouw] = useState('kader');
  React.useEffect(()=>{ setVul(model.f); if(!beschikbaar(uitv)) setUitv(eersteBeschik); },[modelN]);

  const opp = (num(b)/1000)*(num(h)/1000);
  const fam = S.families[vul];
  const factor = S.uitvoering[uitv].factor;
  // Eerst de echte prijslijst 2020 (per model, uitvoering en breedteklasse,
  // EUR per lopende meter) plus indexatie; pas als het model daar niet in
  // staat valt de berekening terug op de familieschatting.
  const bCm = num(b)/10, bM = num(b)/1000;
  const gridSleutel = uitv === 'schuif_vrijdragend' && achterbouw === 'stijl' ? 'schuif_vrijdragend_b' : uitv;
  const grid = (window.PL_PRIJZEN2020?.[model.n]||{})[gridSleutel];
  const klasse = grid ? (grid.find(k=>bCm>=k[0]&&bCm<=k[1]) || grid[grid.length-1]) : null;
  const uitLijst = klasse != null;
  const kost = uitLijst
    ? Math.round((klasse[2]*(1+S.indexatie2020/100)*bM + num(extra))*100)/100
    : (fam.basis + opp*fam.perM2)*factor + num(extra);
  const verkoop = kost*(1+S.marges.poort/100);

  const toevoegen = () => add({
    cat:'poort', kost:Math.round(kost*100)/100, marge:S.marges.poort, aantal:1,
    omschrijving:`Poort ${model.n} — ${S.uitvoering[uitv].label}${uitv==='schuif_vrijdragend' ? ` (achterbouw ${achterbouw})` : ''}, ${num(b)}×${num(h)} mm, RAL ${ral}`,
  });

  return (
    <Blok titel="1. Poort configureren" filo="De prijs komt uit de prijslijst 2020 per model, uitvoering en breedteklasse (per lopende meter) plus de indexatie. Dure bewerkingen zoals een groef zitten in de basisprijs per model. Enkel modellen buiten de lijst vallen terug op de familieschatting.">
      <div className="grid sm:grid-cols-3 gap-3">
        <Veld label="Model">
          <select className="cel mt-1" value={modelN} onChange={e=>setModelN(e.target.value)}>
            {D.models.map(m=><option key={m.n} value={m.n}>{m.n}{m.g?'  (beschikbaarheid nog te bevestigen)':''}</option>)}
          </select>
        </Veld>
        <Veld label="Uitvoering">
          <select className="cel mt-1" value={uitv} onChange={e=>setUitv(e.target.value)}>
            {uitvKeys.map(k=><option key={k} value={k} disabled={!beschikbaar(k)}>{S.uitvoering[k].label}{beschikbaar(k)?'':' — niet beschikbaar'}</option>)}
          </select>
        </Veld>
        <Veld label="Vulling / prijsfamilie">
          <select className="cel mt-1" value={vul} onChange={e=>setVul(e.target.value)}>
            {Object.entries(S.families).map(([k,f])=><option key={k} value={k}>{f.label}</option>)}
          </select>
        </Veld>
      </div>
      <div className="grid sm:grid-cols-4 gap-3 mt-3">
        <Veld label="Breedte (mm)"><input className="cel mt-1" value={b} onChange={e=>setB(e.target.value)} inputMode="numeric"/></Veld>
        <Veld label="Hoogte (mm)"><input className="cel mt-1" value={h} onChange={e=>setH(e.target.value)} inputMode="numeric"/></Veld>
        <Veld label="RAL kleur"><input className="cel mt-1" value={ral} onChange={e=>setRal(e.target.value)}/></Veld>
        <Veld label="Meerprijs opties (€)"><input className="cel mt-1" value={extra} onChange={e=>setExtra(e.target.value)} inputMode="numeric"/></Veld>
      </div>
      {uitv==='schuif_vrijdragend' && (
        <div className="flex items-center gap-4 mt-3 text-sm text-gray-600">
          Achterbouw:
          {['kader','stijl'].map(k=>(
            <label key={k} className="flex items-center gap-1.5">
              <input type="radio" name="achterbouw" checked={achterbouw===k} onChange={()=>setAchterbouw(k)}/> {k}
            </label>
          ))}
          <span className="text-xs text-gray-400">(kader = prijsset A, stijl = prijsset B — aanname, te bevestigen)</span>
        </div>
      )}
      <div className="flex items-center justify-between mt-4 pt-3 border-t border-gray-100">
        <div className="text-sm text-gray-600">Oppervlakte <b>{opp.toFixed(2)} m²</b> · kostprijs <b>{euro(kost)}</b> · verkoop <b className="brand-txt">{euro(verkoop)}</b>
          <div className="text-xs text-gray-400 mt-0.5">{uitLijst
            ? `Bron: prijslijst 2020 (${euro(klasse[2])}/m) + ${S.indexatie2020}% indexatie`
            : 'Bron: familieschatting (model staat niet in de prijslijst 2020)'}</div>
        </div>
        <button onClick={toevoegen} className="brand text-white text-sm font-semibold rounded-lg px-4 py-2">Toevoegen</button>
      </div>
    </Blok>
  );
}

function AutoBlok({S,add}){
  const [zoek,setZoek] = useState('');
  const [sel,setSel] = useState('');
  const [aant,setAant] = useState(1);
  const lijst = useMemo(()=>{
    const q=zoek.toLowerCase();
    return D.auto.filter(a=>a.n.toLowerCase().includes(q)).slice(0,200);
  },[zoek]);
  const art = D.auto.find(a=>a.n===sel);
  const [grootbestelling,setGrootbestelling] = useState(false);
  const [margeInvoer,setMargeInvoer] = useState(50);
  const isFaac = art && art.fab === 'FAAC';
  // Jef 2026-08-12: de kortingsregel geldt enkel voor Faac (catalogusprijs =
  // verkoopprijs, inkoop = catalogusprijs min de korting). Bij andere
  // leveranciers geef je de marge gewoon op bij het ingeven.
  const toevoegen = () => { if(!art) return;
    if (isFaac) {
      const kortPct = grootbestelling ? S.faacKorting.grootbestelling : S.faacKorting.standaard;
      const kost = Math.round(art.p*(1-kortPct/100)*100)/100;
      const marge = kost>0 ? Math.round((art.p/kost-1)*1000)/10 : 0;
      add({ cat:'automatisering', kost, marge, aantal:num(aant)||1, omschrijving:art.n });
    } else {
      add({ cat:'automatisering', kost:art.p, marge:num(margeInvoer), aantal:num(aant)||1, omschrijving:art.n });
    } };
  return (

function TransportBlok({S,add}){
  const [km,setKm] = useState(20);
  const [voertuig,setVoertuig] = useState('bestelwagen');
  const [personen,setPersonen] = useState(1);
  // De regiotabel van Jef bepaalt de prijs; boven de tabel (150 km) rekent
  // de formule met de gele parameters uit het prijslijstbestand.
  const bestel = voertuig==='bestelwagen';
  const maxP = bestel ? 2 : 3;
  const p = Math.min(personen, maxP);
  const regio = S.transport.regios.find(r=>num(km)>=r.van && num(km)<=r.tot);
  const kolom = bestel ? ('b'+p) : ('v'+p);
  let kost, bron;
  if (regio) { kost = regio[kolom]; bron = `regiotabel ${regio.van} tot ${regio.tot} km`; }
  else {
    const par = S.transport.parameters;
    const snelheid = bestel ? par.snelheidBestelwagen : par.snelheidVrachtwagen;
    const rijkost = bestel ? par.kmBestelwagen : par.kmVrachtwagen;
    const retour = num(km)*2;
    const kwartieren = Math.ceil((retour/snelheid)*4);
    kost = Math.round((par.startkost + retour*rijkost + kwartieren*S.kwartier.monteur*p)*100)/100;
    bron = 'boven de regiotabel: formule met de lijstparameters';
  }
  return (
    <Blok titel="5. Transport" filo="Vervoerskosten volgens de regiotabel uit de prijslijst, per voertuig en aantal personen. Boven 150 km rekent de formule met de gele lijstparameters (gemiddelde snelheid, rijkost per km en startkost).">
      <div className="grid sm:grid-cols-[110px_1fr_110px_auto] gap-2 items-end">
        <Veld label="Afstand enkel (km)"><input className="cel mt-1" value={km} onChange={e=>setKm(e.target.value)} inputMode="numeric"/></Veld>
        <Veld label="Voertuig"><select className="cel mt-1" value={voertuig} onChange={e=>{setVoertuig(e.target.value); if(e.target.value==='bestelwagen'&&personen>2)setPersonen(2);}}>
          <option value="bestelwagen">Bestelwagen</option>
          <option value="vrachtwagen">Vrachtwagen</option>
        </select></Veld>
        <Veld label="Personen"><select className="cel mt-1" value={p} onChange={e=>setPersonen(num(e.target.value))}>
          {Array.from({length:maxP},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}
        </select></Veld>
        <button onClick={()=>add({cat:'transport',kost:Math.round(kost*100)/100,marge:S.marges.transport,aantal:1,
          omschrijving:`Transport ${voertuig} (${num(km)} km, ${p} ${p===1?'persoon':'personen'})`})}
          className="brand text-white text-sm font-semibold rounded-lg px-4 py-2">Toevoegen ({euro(kost)})</button>
      </div>
      <p className="text-xs text-gray-400 mt-2">Bron: {bron}</p>
    </Blok>
  );
}

        ))}</tbody></table>

      </Card>
      <Card titel="Faac inkoopkorting (%)" filo="Catalogusprijs is de verkoopprijs; de inkoop is de catalogusprijs min deze korting.">
        <table className="w-full text-sm"><tbody>
          <tr><td className="py-1">Standaard</td><td className="text-right"><N path={['faacKorting','standaard']}/> %</td></tr>
          <tr><td className="py-1">Grotere bestelling</td><td className="text-right"><N path={['faacKorting','grootbestelling']}/> %</td></tr>
        </tbody></table>
      </Card>
      <Card titel="Marges per categorie (%)" filo="Standaardmarge per producttype.">
        <table className="w-full text-sm"><tbody>{Object.keys(S.marges).map(k=>(
          <tr key={k}><td className="py-1 capitalize">{k}</td><td className="text-right"><N path={['marges',k]}/> %</td></tr>
        ))}</tbody></table>
      </Card>
      <Card titel="Plaatsing (forfaits €)" filo="Automatisering standaard 650, ondergronds +250.">
        <table className="w-full text-sm"><tbody>
          <tr><td className="py-1">Poort</td><td className="text-right"><N path={['plaatsing','poort']}/></td></tr>
          <tr><td className="py-1">Automatisering</td><td className="text-right"><N path={['plaatsing','automatisering']}/></td></tr>
          <tr><td className="py-1">Supplement ondergronds</td><td className="text-right"><N path={['plaatsing','ondergronds']}/></td></tr>
        </tbody></table>
      </Card>
      <Card titel="Vervoerskosten per regio (€)" filo="De regiotabel uit de prijslijst: prijs per rit per voertuig en aantal personen.">
        <table className="w-full text-xs"><thead><tr className="text-gray-400">
          <th className="text-left">km</th><th>Bestel 1p</th><th>Bestel 2p</th><th>Vracht 1p</th><th>Vracht 2p</th><th>Vracht 3p</th>
        </tr></thead>
        <tbody>{S.transport.regios.map((r,i)=>(
          <tr key={i}><td className="py-0.5 whitespace-nowrap">{r.van} tot {r.tot}</td>
            {['b1','b2','v1','v2','v3'].map(k=>(
              <td key={k} className="text-center"><input className="cel !py-0.5 !px-1 w-14 text-right"
                value={r[k]} onChange={e=>set(['transport','regios',i,k],num(e.target.value))}/></td>
            ))}
          </tr>
        ))}</tbody></table>
      </Card>
      <Card titel="Transportformule boven 150 km en korting" filo="De gele parameters uit het prijslijstbestand; gebruikt zodra de afstand boven de regiotabel uitkomt.">
        <table className="w-full text-sm"><tbody>
          <tr><td className="py-1">Gemiddelde snelheid bestelwagen</td><td className="text-right"><N path={['transport','parameters','snelheidBestelwagen']}/> km/u</td></tr>
          <tr><td className="py-1">Gemiddelde snelheid vrachtwagen</td><td className="text-right"><N path={['transport','parameters','snelheidVrachtwagen']}/> km/u</td></tr>
          <tr><td className="py-1">Rijkost bestelwagen</td><td className="text-right"><N path={['transport','parameters','kmBestelwagen']}/> €/km</td></tr>
          <tr><td className="py-1">Rijkost vrachtwagen</td><td className="text-right"><N path={['transport','parameters','kmVrachtwagen']}/> €/km</td></tr>
          <tr><td className="py-1">Startkost</td><td className="text-right"><N path={['transport','parameters','startkost']}/> €</td></tr>
          <tr><td className="py-1">Max korting %</td><td className="text-right"><N path={['kortingMax']}/></td></tr>
        </tbody></table>
      </Card>
    </div>
  );
}
function Card({titel,filo,children}){
  return <section className="bg-white rounded-xl border border-gray-200 p-4"><h3 className="font-semibold brand-txt mb-3">{titel}</h3>{children}</section>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
