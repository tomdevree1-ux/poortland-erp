services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: .env.deploy
    restart: unless-stopped
    expose:
      - "5000"
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    environment:
      DOMEIN: ${DOMEIN}
      SITE_DOMEIN: ${SITE_DOMEIN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  caddy_data:
  caddy_config:
